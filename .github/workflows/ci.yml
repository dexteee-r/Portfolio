name: CI

on:
  push:
  pull_request:

# A newer push to the same branch replaces the run in progress: on main, the
# latest commit is the one that gets deployed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests (includes validation of every content file)
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build, desktop + mobile, axe)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Only a commit on main that passed every check becomes an image.
  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dexteee-r/portfolio
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: >
          docker build
          --build-arg ELMZN_VERSION=${{ github.sha }}
          --tag "$IMAGE:${{ github.sha }}"
          --tag "$IMAGE:latest"
          .

      - name: Smoke-test it, run as the homelab runs it
        run: sh deploy/smoke-test.sh "$IMAGE:${{ github.sha }}" "${{ github.sha }}"

      - name: Publish it to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-server-log
          path: smoke-server.log
          retention-days: 7

  # Deployment is not a job here: once this run succeeds on main, the homelab's
  # own runner takes over (deploy.yml).
