fr:
  title: Pochettes pour Mitch
  coverAlt: "Six pochettes de titres de Mitch en grille — Noir, Utrecht, Calimero, Connexion Bruxelloise Part 2, Den Haag et Troubles —, le croquis annoté d'Utrecht et une case ambre « Pochettes »."
  chapter: creative
  status: published
  cover: /media/projects/pochettes-mitch/cover.webp
  order: 4
  year: 2024
  role: Pochettes, du croquis au fichier final
  stack:
    - Photoshop
  summary: >-
    Une commande, de 2024 à 2026 : les pochettes de six titres de l'artiste
    Mitch. Chaque idée part d'un croquis rapide, puis se monte dans Photoshop
    avec des photos, des textures et le titre.
  body: |
    ## Du croquis à la pochette

    Avant Photoshop, chaque pochette commence par un croquis : la composition,
    le titre, les éléments à trouver.

    ### Noir · 2024

    ![Trois étapes côte à côte : un croquis au trait d'une tour d'immeuble avec le mot NOIR, une maquette où le titre NOIR occupe seul un fond noir, puis la pochette finale, une tour sombre devant une pleine lune, le titre en bas à gauche](/media/projects/pochettes-mitch/noir-etapes.webp "Le croquis, une maquette, la pochette finale.")

    Le croquis pose le titre sur une tour. Une maquette n'a gardé que le
    titre ; la pochette finale revient à la tour, sous une pleine lune.

    ### Utrecht · 2024

    ![Le croquis d'Utrecht, couvert de notes de couleur, à côté de la pochette finale : un mur fissuré au titre gothique, un tonneau en feu, des billets qui volent, une vitre brisée, un ciel orange](/media/projects/pochettes-mitch/utrecht-etapes.webp "Le croquis annoté, la pochette finale.")

    Le croquis note chaque idée : la cité, un tonneau en feu, des impacts de
    balle, une plaque néerlandaise, des billets dans les coins, et un filtre
    orange et jaune pour l'été. La pochette en garde la plupart.

    ### Troubles · 2025

    ![Une maquette au trait, des personnages en bâtons sous le mot TROUBLE, à côté de la pochette finale : le titre TROUBLES en grandes lettres grises, pris dans la fumée](/media/projects/pochettes-mitch/troubles-etapes.webp "La maquette, la pochette finale.")

    ### Connexion Bruxelloise Part 2 · 2026

    ![Un croquis de la composition à côté de la pochette finale : un parking souterrain baigné de lumière turquoise, deux silhouettes en capuche dans l'ombre, le titre tagué sur le mur et des éclats de verre aux coins](/media/projects/pochettes-mitch/connexion-etapes.webp "Le croquis, la pochette finale.")

    ## Les autres pochettes

    ![Calimero : le titre en blanc entre des nuages, derrière une vitre couverte de gouttes de pluie, en noir et blanc](/media/projects/pochettes-mitch/calimero.webp "Calimero, 2024.")

    ![Den Haag : le titre en lettres blanches sur un papier noir froissé](/media/projects/pochettes-mitch/denhaag.webp "Den Haag, 2024.")
en:
  title: Covers for Mitch
  coverAlt: "Six covers of Mitch's tracks in a grid — Noir, Utrecht, Calimero, Connexion Bruxelloise Part 2, Den Haag and Troubles —, the annotated Utrecht sketch and an amber tile reading “Pochettes”."
  role: Covers, from sketch to final file
  summary: >-
    A commission, from 2024 to 2026: the covers of six tracks by the artist
    Mitch. Each idea starts as a quick sketch, then comes together in
    Photoshop with photos, textures and the title.
  body: |
    ## From sketch to cover

    Before Photoshop, every cover starts as a sketch: the layout, the title,
    the things to find.

    ### Noir · 2024

    ![Three steps side by side: a line sketch of a tower block with the word NOIR, a mock-up where the title NOIR stands alone on black, then the final cover, a dark tower before a full moon, the title bottom left](/media/projects/pochettes-mitch/noir-etapes.webp "The sketch, a mock-up, the final cover.")

    The sketch sets the title on a tower. A mock-up kept only the title; the
    final cover goes back to the tower, under a full moon.

    ### Utrecht · 2024

    ![The Utrecht sketch, covered in coloured notes, beside the final cover: a cracked wall with a gothic title, a burning barrel, flying banknotes, shattered glass, an orange sky](/media/projects/pochettes-mitch/utrecht-etapes.webp "The annotated sketch, the final cover.")

    The sketch notes every idea: the estate, a burning barrel, bullet holes,
    a Dutch number plate, banknotes in the corners, and an orange and yellow
    filter for summer. The cover keeps most of them.

    ### Troubles · 2025

    ![A line mock-up, stick figures under the word TROUBLE, beside the final cover: the title TROUBLES in large grey letters, caught in smoke](/media/projects/pochettes-mitch/troubles-etapes.webp "The mock-up, the final cover.")

    ### Connexion Bruxelloise Part 2 · 2026

    ![A layout sketch beside the final cover: an underground car park in turquoise light, two hooded figures in the shadows, the title sprayed on the wall and shards of glass in the corners](/media/projects/pochettes-mitch/connexion-etapes.webp "The sketch, the final cover.")

    ## The other covers

    ![Calimero: the title in white among clouds, behind a window covered in raindrops, in black and white](/media/projects/pochettes-mitch/calimero.webp "Calimero, 2024.")

    ![Den Haag: the title in white letters on crumpled black paper](/media/projects/pochettes-mitch/denhaag.webp "Den Haag, 2024.")