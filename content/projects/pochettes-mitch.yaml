  body: |
    ## The covers

    ![Noir: a dark tower block before a full moon, the title NOIR bottom left](/media/projects/pochettes-mitch/noir.webp "Noir, 2024.")

    ![Utrecht: a cracked wall with a gothic title, a burning barrel, flying banknotes, shattered glass, an orange sky](/media/projects/pochettes-mitch/utrecht.webp "Utrecht, 2024.")

    ![Calimero: the title in white among clouds, behind a window covered in raindrops, in black and white](/media/projects/pochettes-mitch/calimero.webp "Calimero, 2024.")

    ![Den Haag: the title in white letters on crumpled black paper](/media/projects/pochettes-mitch/denhaag.webp "Den Haag, 2024.")

    ![Troubles: the title TROUBLES in large grey letters, caught in smoke](/media/projects/pochettes-mitch/troubles.webp "Troubles, 2025.")

    ![Connexion Bruxelloise Part 2: an underground car park in turquoise light, two hooded figures in the shadows, the title sprayed on the wall and shards of glass in the corners](/media/projects/pochettes-mitch/connexion.webp "Connexion Bruxelloise Part 2, 2026.")
