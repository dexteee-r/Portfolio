  summary: >-
    A gaming PC built from scratch, from the boxes to the first boot: a Ryzen
    9, an RTX 5070 Ti, a 280 mm liquid cooler and 64 GB of DDR5.
  body: |
    ## The parts

    - **Processor**: AMD Ryzen 9, on an MSI MAG B850 Tomahawk Max WiFi
      motherboard.
    - **Graphics card**: ASUS TUF Gaming GeForce RTX 5070 Ti, 16 GB.
    - **Cooling**: Arctic Liquid Freezer III Pro 280 A-RGB liquid cooler.
    - **Memory**: 64 GB of Kingston FURY Beast DDR5, in two 32 GB sticks.
    - **Storage**: a 2 TB Samsung 990 Pro NVMe SSD, and a hard drive.
    - **Power supply**: MSI, ATX 3.1 certified.

    ## Built

    ![The PC built and switched on, seen through its glass: the liquid cooler's fans and the graphics card lit green and purple](/media/projects/pc-ryzen-9-rtx-5070-ti/allume.webp "Built, switched on.")
