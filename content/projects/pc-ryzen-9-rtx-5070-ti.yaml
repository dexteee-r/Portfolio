  body: |
    ## Les pièces

    - **Processeur** : AMD Ryzen 9, sur une carte mère MSI MAG B850 Tomahawk
      Max WiFi.
    - **Carte graphique** : ASUS TUF Gaming GeForce RTX 5070 Ti, 16 Go.
    - **Refroidissement** : watercooling Arctic Liquid Freezer III Pro 280
      A-RGB.
    - **Mémoire** : 64 Go de DDR5 Kingston FURY Beast, en deux barrettes de
      32 Go.
    - **Stockage** : un SSD NVMe Samsung 990 Pro de 2 To, et un disque dur.
    - **Alimentation** : MSI, certifiée ATX 3.1.

    ## Monté

    ![Le PC monté et allumé, vu à travers sa vitre : les ventilateurs du watercooling et la carte graphique éclairés en vert et en violet](/media/projects/pc-ryzen-9-rtx-5070-ti/allume.webp "Monté, allumé.")
