fr:
  title: Accès distant / VPN
  coverAlt: "Schéma : un téléphone en 4G relié au réseau de la maison par un tunnel WireGuard chiffré."
  chapter: infra
  status: published
  cover: /media/projects/acces-distant/cover.webp
