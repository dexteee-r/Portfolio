  summary: >-
    Un PC monté en avril 2025 autour d'un Ryzen 5 et d'une RTX 4060, puis
    repris en septembre 2026 : la carte graphique laisse place à une RTX
    4060 Ti, pilotes effacés avant l'échange.
  body: |
    ## Le montage, avril 2025

    - **Processeur** : AMD Ryzen 5, sur une carte mère Gigabyte B650 Eagle AX,
      sous un ventirad Thermalright Assassin X 120 Refined SE.
    - **Carte graphique** : Gigabyte GeForce RTX 4060 Windforce OC, 8 Go.
    - **Mémoire** : 32 Go de DDR5 Corsair Vengeance RGB.
    - **Stockage** : un SSD Crucial BX500 et un disque dur Seagate BarraCuda.
    - **Alimentation** : MSI MAG A850GL, prête pour l'ATX 3.1 et le PCIe 5.1.

    ![Le PC monté et allumé, vitre ouverte : le ventirad blanc et la mémoire éclairés en violet](/media/projects/pc-ryzen-5-rtx-4060-ti/allume.webp "Monté, allumé.")

    ## La mise à niveau, septembre 2026

    La RTX 4060 laisse place à une RTX 4060 Ti.

    - **Les pilotes d'abord.** Avant de toucher au matériel, Display Driver
      Uninstaller efface les pilotes de l'ancienne carte, pour que la nouvelle
      reparte d'une installation propre.
    - **L'échange.** L'ancienne carte sort du boîtier ; la nouvelle, une MSI,
      est dépoussiérée à la soufflette avant d'y entrer.

    ![Display Driver Uninstaller ouvert sur l'écran, le curseur sur « Nettoyer et éteindre »](/media/projects/pc-ryzen-5-rtx-4060-ti/ddu.webp "Display Driver Uninstaller : nettoyer, puis éteindre pour changer de carte.")

    ![Une main retire la carte graphique du boîtier ouvert, au-dessus de l'alimentation MSI A850GL](/media/projects/pc-ryzen-5-rtx-4060-ti/demontage.webp "L'ancienne carte sort.")

    ![Une carte graphique MSI à deux ventilateurs posée sur le bureau, dépoussiérée à la soufflette électrique](/media/projects/pc-ryzen-5-rtx-4060-ti/nettoyage.webp "La nouvelle, dépoussiérée avant le montage.")
