  summary: >-
    A PC built in April 2025 around a Ryzen 5 and an RTX 4060, then taken up
    again in September 2026: the graphics card makes way for an RTX 4060 Ti,
    drivers wiped before the swap.
  body: |
    ## The build, April 2025

    - **Processor**: AMD Ryzen 5, on a Gigabyte B650 Eagle AX motherboard,
      under a Thermalright Assassin X 120 Refined SE cooler.
    - **Graphics card**: Gigabyte GeForce RTX 4060 Windforce OC, 8 GB.
    - **Memory**: 32 GB of Corsair Vengeance RGB DDR5.
    - **Storage**: a Crucial BX500 SSD and a Seagate BarraCuda hard drive.
    - **Power supply**: MSI MAG A850GL, ready for ATX 3.1 and PCIe 5.1.

    ![The PC built and switched on, its glass off: the white cooler and the memory lit purple](/media/projects/pc-ryzen-5-rtx-4060-ti/allume.webp "Built, switched on.")

    ## The upgrade, September 2026

    The RTX 4060 makes way for an RTX 4060 Ti.

    - **Drivers first.** Before touching the hardware, Display Driver
      Uninstaller wipes the old card's drivers, so the new one starts from a
      clean install.
    - **The swap.** The old card comes out of the case; the new one, an MSI,
      is dusted off with a blower before it goes in.

    ![Display Driver Uninstaller open on screen, the cursor on "Clean and shut down"](/media/projects/pc-ryzen-5-rtx-4060-ti/ddu.webp "Display Driver Uninstaller: clean, then shut down to change cards.")

    ![A hand takes the graphics card out of the open case, above the MSI A850GL power supply](/media/projects/pc-ryzen-5-rtx-4060-ti/demontage.webp "The old card comes out.")

    ![A two-fan MSI graphics card on the desk, dusted off with an electric blower](/media/projects/pc-ryzen-5-rtx-4060-ti/nettoyage.webp "The new one, dusted off before it goes in.")
