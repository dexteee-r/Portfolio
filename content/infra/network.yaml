# The homelab, as the Homelab chapter draws it — edited in the CMS (Homelab).
# Drawn from github.com/dexteee-r/elmzn_homelab (README, 2026-09-30): only
# what runs today — nothing stopped (n8n, Ollama), unused (Grafana and
# Prometheus, left unfinished; taken off on 2026-10-04 at its owner's request)
# or still being set up (Vaultwarden, Checkmk, Home Assistant, Pi-hole, Poste.io).
# Names only, never an address or a port: the build refuses them.
# Published by its owner on 2026-10-01.
status: published
nodes:
  - id: internet
    label: Internet
    kind: internet
  - id: box
    label: Box
    kind: router
    parent: internet

  # Machine 1 — the extranet, the only one open to the internet.
  - id: pve-extranet
    label: Extranet · DMZ
    kind: hypervisor
    parent: box
  - id: vm-extranet
    label: vm-extranet
    kind: vm
    parent: pve-extranet
  - id: npm
    label: Nginx Proxy Manager
    kind: proxy
    parent: vm-extranet
  - id: links
    label: links.elmzn.be
    kind: service
    parent: vm-extranet
  - id: portfolio
    label: elmzn.be
    kind: container
    parent: pve-extranet
  - id: watchlist
    label: watchlist.elmzn.be
    kind: container
    parent: pve-extranet
  - id: mytcg
    label: mytcg.elmzn.be
    kind: container
    parent: pve-extranet
  - id: lxc-web
    label: lxc-web
    kind: container
    parent: pve-extranet
  - id: wireguard
    label: WireGuard
    kind: container
    parent: pve-extranet

  # Machine 2 — the intranet, never exposed.
  - id: pve-intranet
    label: Intranet
    kind: hypervisor
    parent: box
  - id: vm-intranet
    label: vm-intranet
    kind: vm
    parent: pve-intranet
  - id: immich
    label: Immich
    kind: service
    parent: vm-intranet
  - id: minecraft
    label: Minecraft
    kind: container
    parent: pve-intranet
  - id: filestore
    label: FileBrowser
    kind: container
    parent: pve-intranet

  # Machine 3 — the family NAS.
  - id: nas
    label: ZimaOS
    kind: nas
    parent: box
